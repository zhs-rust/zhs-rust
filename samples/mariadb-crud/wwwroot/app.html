<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>商品管理 - zhs mariadb-crud</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <header class="app-header">
        <span class="title">商品管理(MariaDB CRUD)</span>
        <div class="user-box">
            <span id="current-user"></span>
            <span class="role-tag" id="current-role"></span>
            <button class="btn-secondary" id="logout-button" type="button">退出登录</button>
        </div>
    </header>

    <main class="app-main">
        <!-- 搜索 / 新增工具条 -->
        <div class="toolbar">
            <input id="keyword" placeholder="按名称或分类搜索…">
            <button class="btn-primary" id="search-button" type="button">查 询</button>
            <button class="btn-secondary" id="reset-button" type="button">重 置</button>
            <span class="spacer"></span>
            <button class="btn-primary" id="create-button" type="button">+ 新增商品</button>
        </div>

        <!-- 新增 / 编辑表单(默认隐藏) -->
        <div class="panel hidden" id="form-panel">
            <div class="panel-header" id="form-title">新增商品</div>
            <form id="product-form">
                <div class="form-grid">
                    <div>
                        <label for="field-name">名称 *</label>
                        <input id="field-name" required maxlength="100" placeholder="例如:机械键盘">
                    </div>
                    <div>
                        <label for="field-category">分类 *</label>
                        <input id="field-category" required maxlength="50" placeholder="例如:外设">
                    </div>
                    <div>
                        <label for="field-price">单价(元)*</label>
                        <input id="field-price" type="number" min="0" step="0.01" required placeholder="199.00">
                    </div>
                    <div>
                        <label for="field-quantity">数量 *</label>
                        <input id="field-quantity" type="number" min="0" step="1" required placeholder="10">
                    </div>
                </div>
                <div class="form-actions">
                    <button class="btn-secondary" type="button" id="cancel-button">取 消</button>
                    <button class="btn-primary" type="submit" id="save-button">保 存</button>
                </div>
            </form>
        </div>

        <!-- 数据表格 -->
        <div class="panel">
            <table>
                <thead>
                <tr>
                    <th style="width: 60px">ID</th>
                    <th>名称</th>
                    <th>分类</th>
                    <th style="width: 110px">单价(元)</th>
                    <th style="width: 80px">数量</th>
                    <th style="width: 180px">更新时间</th>
                    <th style="width: 130px">操作</th>
                </tr>
                </thead>
                <tbody id="table-body">
                <tr class="empty-row"><td colspan="7">加载中…</td></tr>
                </tbody>
            </table>
            <div class="pager">
                <span id="page-info">-</span>
                <div class="buttons">
                    <button class="btn-secondary" id="prev-button" type="button">上一页</button>
                    <span id="page-number">1</span>
                    <button class="btn-secondary" id="next-button" type="button">下一页</button>
                </div>
            </div>
        </div>
    </main>

    <div class="toast" id="toast"></div>

    <script src="/app.js"></script>
</body>
</html>
